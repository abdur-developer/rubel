<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Exam Admin Panel</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .modal-bg {
            background: rgba(0, 0, 0, 0.55);
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen">

<!-- ================= LOGIN ================= -->

<div id="loginPage" class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-8">

        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">
                Job Exam
            </h1>

            <p class="text-gray-500 mt-2">
                Admin Panel
            </p>
        </div>

        <form id="loginForm">

            <div class="mb-4">
                <label class="block text-sm font-semibold mb-2">
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    class="w-full border rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Username"
                    required
                >
            </div>

            <div class="mb-5">
                <label class="block text-sm font-semibold mb-2">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    class="w-full border rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Password"
                    required
                >
            </div>

            <p id="loginError"
               class="text-red-500 text-sm mb-4 hidden">
                Username অথবা password ভুল।
            </p>

            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg">
                Login
            </button>

        </form>

    </div>
</div>


<!-- ================= ADMIN PANEL ================= -->

<div id="adminPage" class="hidden">

    <!-- Navbar -->

    <nav class="bg-white shadow-sm sticky top-0 z-30">

        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">

            <div>
                <h1 class="text-xl font-bold text-gray-800">
                    Job Exam Admin
                </h1>

                <p class="text-xs text-gray-500">
                    Circular Management
                </p>
            </div>

            <button
                onclick="logout()"
                class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm">
                Logout
            </button>

        </div>

    </nav>


    <!-- Main -->

    <main class="max-w-7xl mx-auto p-4 md:p-6">

        <!-- Header -->

        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">

            <div>
                <h2 class="text-2xl font-bold text-gray-800">
                    All Circulars
                </h2>

                <p id="totalCircular"
                   class="text-gray-500 text-sm mt-1">
                    Loading...
                </p>
            </div>

            <button
                onclick="openAddModal()"
                class="bg-green-600 hover:bg-green-700 text-white px-5 py-3 rounded-lg font-semibold">
                + Add Circular
            </button>

        </div>


        <!-- Loading -->

        <div id="loading"
             class="text-center py-10 text-gray-500">
            Circular loading হচ্ছে...
        </div>


        <!-- Table -->

        <div class="bg-white rounded-xl shadow overflow-x-auto">

            <table class="w-full text-sm">

                <thead class="bg-gray-50 border-b">

                    <tr>
                        <th class="text-left px-4 py-4">Title</th>
                        <th class="text-left px-4 py-4">Category</th>
                        <th class="text-left px-4 py-4">Post</th>
                        <th class="text-left px-4 py-4">Apply End</th>
                        <th class="text-left px-4 py-4">Vacancies</th>
                        <th class="text-center px-4 py-4">Action</th>
                    </tr>

                </thead>

                <tbody id="circularTable"></tbody>

            </table>

        </div>

    </main>

</div>


<!-- ================= ADD / EDIT MODAL ================= -->

<div id="modal"
     class="hidden fixed inset-0 modal-bg z-50 flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-4xl max-h-[95vh] overflow-y-auto rounded-2xl shadow-xl">

        <!-- Modal Header -->

        <div class="flex items-center justify-between border-b px-6 py-4">

            <h2 id="modalTitle"
                class="text-xl font-bold">
                Add Circular
            </h2>

            <button
                onclick="closeModal()"
                class="text-gray-500 hover:text-black text-2xl">
                ×
            </button>

        </div>


        <!-- Form -->

        <form id="circularForm"
              class="p-6">

            <input type="hidden" id="editId">


            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">


                <!-- Title -->

                <div class="md:col-span-2">
                    <label class="label">Title</label>

                    <input
                        id="title"
                        class="input"
                        required>
                </div>


                <!-- Category -->

                <div>
                    <label class="label">Category</label>

                    <input
                        id="category"
                        class="input"
                        placeholder="POLICE">
                </div>


                <!-- Organization -->

                <div>
                    <label class="label">Organization</label>

                    <input
                        id="organization"
                        class="input">
                </div>


                <!-- Post -->

                <div>
                    <label class="label">Post</label>

                    <input
                        id="post"
                        class="input">
                </div>


                <!-- Publish -->

                <div>
                    <label class="label">Publish Date</label>

                    <input
                        id="publish"
                        type="date"
                        class="input">
                </div>


                <!-- Apply Start -->

                <div>
                    <label class="label">Apply Start</label>

                    <input
                        id="apply_start"
                        type="date"
                        class="input">
                </div>


                <!-- Apply End -->

                <div>
                    <label class="label">Apply End</label>

                    <input
                        id="apply_end"
                        type="date"
                        class="input">
                </div>


                <!-- Website -->

                <div>
                    <label class="label">Website</label>

                    <input
                        id="website"
                        class="input">
                </div>


                <!-- Apply Link -->

                <div>
                    <label class="label">Apply Link</label>

                    <input
                        id="apply_link"
                        class="input">
                </div>


                <!-- Image -->

                <div>
                    <label class="label">Image Link</label>

                    <input
                        id="image_link"
                        class="input">
                </div>


                <!-- PDF -->

                <div>
                    <label class="label">PDF Link</label>

                    <input
                        id="pdf_link"
                        class="input">
                </div>


                <!-- Age -->

                <div>
                    <label class="label">Age</label>

                    <input
                        id="age"
                        class="input"
                        placeholder="18-20">
                </div>


                <!-- Experience -->

                <div>
                    <label class="label">Experience</label>

                    <input
                        id="experience"
                        class="input"
                        placeholder="লাগবে না">
                </div>


                <!-- Education -->

                <div>
                    <label class="label">Education</label>

                    <input
                        id="education"
                        class="input"
                        placeholder="SSC 2.50+">
                </div>


                <!-- Source -->

                <div>
                    <label class="label">Source</label>

                    <input
                        id="source"
                        class="input"
                        placeholder="অফিশিয়াল ওয়েবসাইট">
                </div>


                <!-- Vacancies -->

                <div>
                    <label class="label">Vacancies</label>

                    <input
                        id="vacancies"
                        class="input"
                        placeholder="0">
                </div>


                <!-- Apply Online -->

                <div>
                    <label class="label">Apply Is Online</label>

                    <select
                        id="applyIsOnline"
                        class="input">

                        <option value="1">Yes</option>
                        <option value="0">No</option>

                    </select>
                </div>


                <!-- Fee -->

                <div>
                    <label class="label">Apply Fee</label>

                    <input
                        id="applyFee"
                        class="input"
                        placeholder="45">
                </div>


                <!-- Gender -->

                <div>
                    <label class="label">Gender</label>

                    <select
                        id="gender"
                        class="input">

                        <option value="0">All</option>
                        <option value="1">Male</option>
                        <option value="2">Female</option>

                    </select>

                </div>

            </div>


            <!-- Buttons -->

            <div class="flex justify-end gap-3 mt-6 pt-5 border-t">

                <button
                    type="button"
                    onclick="closeModal()"
                    class="px-5 py-3 rounded-lg bg-gray-200 hover:bg-gray-300">
                    Cancel
                </button>

                <button
                    type="submit"
                    id="saveButton"
                    class="px-6 py-3 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold">
                    Save
                </button>

            </div>

        </form>

    </div>
</div>


<script>

/* =========================================
   CONFIG
========================================= */

// তোমার deployed API URL এখানে বসাবে

const API_BASE = "https://jobexamapi.vercel.app";


/* =========================================
   LOGIN
========================================= */

const ADMIN_USERNAME = "admin";
const ADMIN_PASSWORD = "admin123@#&";


document
    .getElementById("loginForm")
    .addEventListener("submit", function(e) {

        e.preventDefault();

        const username =
            document.getElementById("username").value.trim();

        const password =
            document.getElementById("password").value;


        if (
            username === ADMIN_USERNAME &&
            password === ADMIN_PASSWORD
        ) {

            localStorage.setItem("admin_logged_in", "true");

            showAdmin();

        } else {

            document
                .getElementById("loginError")
                .classList.remove("hidden");

        }

    });


/* =========================================
   CHECK LOGIN
========================================= */

function checkLogin() {

    if (
        localStorage.getItem("admin_logged_in") === "true"
    ) {

        showAdmin();

    }

}


/* =========================================
   SHOW ADMIN
========================================= */

function showAdmin() {

    document
        .getElementById("loginPage")
        .classList.add("hidden");

    document
        .getElementById("adminPage")
        .classList.remove("hidden");

    loadCirculars();

}


/* =========================================
   LOGOUT
========================================= */

function logout() {

    localStorage.removeItem("admin_logged_in");

    location.reload();

}


/* =========================================
   LOAD CIRCULARS
========================================= */

async function loadCirculars() {

    const loading =
        document.getElementById("loading");

    const table =
        document.getElementById("circularTable");

    loading.classList.remove("hidden");

    table.innerHTML = "";


    try {

        const response = await fetch(
            `${API_BASE}/admin/circulars`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                }
            }
        );


        if (!response.ok) {
            throw new Error("API Error");
        }


        const data = await response.json();


        loading.classList.add("hidden");


        document
            .getElementById("totalCircular")
            .innerText =
            `${data.length} টি circular পাওয়া গেছে`;


        if (data.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="6"
                        class="text-center py-10 text-gray-500">
                        কোনো circular পাওয়া যায়নি
                    </td>
                </tr>
            `;

            return;
        }


        data.forEach(item => {

            const tr =
                document.createElement("tr");

            tr.className =
                "border-b hover:bg-gray-50";


            tr.innerHTML = `

                <td class="px-4 py-4">

                    <div class="font-semibold text-gray-800">
                        ${escapeHtml(item.title || "")}
                    </div>

                    <div class="text-xs text-gray-500 mt-1">
                        ${escapeHtml(item.organization || "")}
                    </div>

                </td>


                <td class="px-4 py-4">
                    <span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs">
                        ${escapeHtml(item.category || "")}
                    </span>
                </td>


                <td class="px-4 py-4">
                    ${escapeHtml(item.post || "")}
                </td>


                <td class="px-4 py-4">
                    ${escapeHtml(item.apply_end || "")}
                </td>


                <td class="px-4 py-4">
                    ${escapeHtml(item.vacancies || "0")}
                </td>


                <td class="px-4 py-4 text-center">

                    <button
                        onclick='editCircular(${JSON.stringify(item)})'
                        class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded-lg text-xs">
                        Edit
                    </button>

                </td>

            `;


            table.appendChild(tr);

        });


    } catch (error) {

        loading.classList.add("hidden");

        table.innerHTML = `

            <tr>
                <td colspan="6"
                    class="text-center py-10 text-red-500">

                    Circular load করা যায়নি।

                    <br>

                    <button
                        onclick="loadCirculars()"
                        class="mt-3 bg-blue-500 text-white px-4 py-2 rounded">
                        Retry
                    </button>

                </td>
            </tr>

        `;

        console.error(error);

    }

}


/* =========================================
   ADD MODAL
========================================= */

function openAddModal() {

    document
        .getElementById("circularForm")
        .reset();


    document
        .getElementById("editId")
        .value = "";


    document
        .getElementById("modalTitle")
        .innerText = "Add Circular";


    document
        .getElementById("saveButton")
        .innerText = "Add Circular";


    document
        .getElementById("modal")
        .classList.remove("hidden");

}


/* =========================================
   EDIT CIRCULAR
========================================= */

function editCircular(item) {

    document
        .getElementById("editId")
        .value = item._id?.$oid || item._id || "";


    const fields = [

        "title",
        "category",
        "organization",
        "post",
        "publish",
        "apply_start",
        "apply_end",
        "website",
        "apply_link",
        "image_link",
        "pdf_link",
        "age",
        "experience",
        "education",
        "source",
        "vacancies",
        "applyIsOnline",
        "applyFee",
        "gender"

    ];


    fields.forEach(field => {

        const element =
            document.getElementById(field);

        if (element) {

            element.value =
                item[field] ?? "";

        }

    });


    document
        .getElementById("modalTitle")
        .innerText = "Edit Circular";


    document
        .getElementById("saveButton")
        .innerText = "Update";


    document
        .getElementById("modal")
        .classList.remove("hidden");

}


/* =========================================
   CLOSE MODAL
========================================= */

function closeModal() {

    document
        .getElementById("modal")
        .classList.add("hidden");

}


/* =========================================
   SAVE / UPDATE
========================================= */

document
    .getElementById("circularForm")
    .addEventListener("submit", async function(e) {

        e.preventDefault();


        const editId =
            document.getElementById("editId").value;


        const data = {

            title:
                document.getElementById("title").value,

            category:
                document.getElementById("category").value,

            organization:
                document.getElementById("organization").value,

            post:
                document.getElementById("post").value,

            publish:
                document.getElementById("publish").value,

            apply_start:
                document.getElementById("apply_start").value,

            apply_end:
                document.getElementById("apply_end").value,

            website:
                document.getElementById("website").value,

            apply_link:
                document.getElementById("apply_link").value,

            image_link:
                document.getElementById("image_link").value,

            pdf_link:
                document.getElementById("pdf_link").value,

            age:
                document.getElementById("age").value,

            experience:
                document.getElementById("experience").value,

            education:
                document.getElementById("education").value,

            source:
                document.getElementById("source").value,

            vacancies:
                document.getElementById("vacancies").value,

            applyIsOnline:
                document.getElementById("applyIsOnline").value,

            applyFee:
                document.getElementById("applyFee").value,

            gender:
                document.getElementById("gender").value

        };


        const button =
            document.getElementById("saveButton");

        button.disabled = true;

        button.innerText = "Saving...";


        try {

            let response;


            /* UPDATE */

            if (editId) {

                response = await fetch(
                    `${API_BASE}/circular/update/${editId}`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(data)
                    }
                );

            }

            /* ADD */

            else {

                response = await fetch(
                    `${API_BASE}/circular/add`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(data)
                    }
                );

            }


            const result =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    result.error || "Something went wrong"
                );

            }


            alert(
                editId
                    ? "Circular successfully updated!"
                    : "Circular successfully added!"
            );


            closeModal();

            loadCirculars();


        } catch (error) {

            alert(
                "Error: " + error.message
            );

            console.error(error);

        }


        button.disabled = false;

        button.innerText =
            editId ? "Update" : "Add Circular";

    });


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================
   START
========================================= */

checkLogin();

</script>


<!-- Tailwind custom classes -->

<script>

tailwind.config = {

    theme: {

        extend: {

            // এখানে চাইলে নিজের color/theme দিতে পারো

        }

    }

};


document.querySelectorAll(".label")
    .forEach(el => {

        el.className =
            "block text-sm font-semibold mb-2 text-gray-700";

    });


document.querySelectorAll(".input")
    .forEach(el => {

        el.classList.add(
            "w-full",
            "border",
            "rounded-lg",
            "px-4",
            "py-3",
            "outline-none",
            "focus:ring-2",
            "focus:ring-blue-500"
        );

    });

</script>

</body>
</html>
